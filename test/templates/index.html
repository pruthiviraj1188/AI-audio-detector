<!DOCTYPE html>
<html>
<head>
    <title>AI Audio Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #050510;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 0;
        }

        /* Aurora blobs */
        .aurora {
            position: fixed;
            z-index: 0;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: drift 18s ease-in-out infinite;
        }
        .aurora-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #7c3aed, transparent);
            top: -150px; left: -100px;
            animation-duration: 20s;
        }
        .aurora-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #2563eb, transparent);
            bottom: -100px; right: -100px;
            animation-duration: 25s;
            animation-delay: -8s;
        }
        .aurora-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #0ea5e9, transparent);
            top: 40%; left: 50%;
            animation-duration: 22s;
            animation-delay: -4s;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -30px) scale(1.05); }
            66% { transform: translate(-30px, 40px) scale(0.95); }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .card {
            background: rgba(10, 10, 30, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 48px 56px;
            width: 460px;
            box-shadow:
                0 0 0 1px rgba(124, 58, 237, 0.1),
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        /* Animated equalizer bars */
        .eq-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            height: 30px;
            margin-bottom: 16px;
        }

        .eq-bar {
            width: 3px;
            border-radius: 2px;
            background: linear-gradient(to top, #7c3aed, #38bdf8);
            animation: eq 1.4s ease-in-out infinite;
        }

        .eq-bar:nth-child(1)  { height: 8px;  animation-delay: 0.0s; }
        .eq-bar:nth-child(2)  { height: 18px; animation-delay: 0.1s; }
        .eq-bar:nth-child(3)  { height: 26px; animation-delay: 0.2s; }
        .eq-bar:nth-child(4)  { height: 14px; animation-delay: 0.3s; }
        .eq-bar:nth-child(5)  { height: 30px; animation-delay: 0.15s; }
        .eq-bar:nth-child(6)  { height: 20px; animation-delay: 0.25s; }
        .eq-bar:nth-child(7)  { height: 30px; animation-delay: 0.1s; }
        .eq-bar:nth-child(8)  { height: 14px; animation-delay: 0.35s; }
        .eq-bar:nth-child(9)  { height: 26px; animation-delay: 0.2s; }
        .eq-bar:nth-child(10) { height: 18px; animation-delay: 0.1s; }
        .eq-bar:nth-child(11) { height: 8px;  animation-delay: 0.0s; }

        @keyframes eq {
            0%, 100% { transform: scaleY(0.3); opacity: 0.5; }
            50%       { transform: scaleY(1);   opacity: 1; }
        }

        h1 {
            color: #f1f5f9;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: rgba(148, 163, 184, 0.6);
            font-size: 13px;
            margin-bottom: 36px;
        }

        .upload-area {
            border: 1.5px dashed rgba(99, 179, 237, 0.25);
            border-radius: 18px;
            padding: 28px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
        }

        .upload-area:hover {
            border-color: rgba(99, 179, 237, 0.6);
            background: rgba(56, 189, 248, 0.04);
            transform: translateY(-1px);
        }

        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .upload-icon { font-size: 30px; margin-bottom: 8px; }

        .upload-text {
            color: rgba(203, 213, 225, 0.7);
            font-size: 14px;
        }

        .upload-text span {
            color: #38bdf8;
            font-weight: 600;
        }

        .file-types {
            color: rgba(148, 163, 184, 0.35);
            font-size: 11px;
            margin-top: 5px;
        }

        .selected-file {
            color: #38bdf8;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            display: none;
            animation: fadeUp 0.4s ease;
        }

        .result.human {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .result.ai {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .result.error {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
        }

        .result-label {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .progress-wrap {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-bar {
            height: 100%;
            border-radius: 999px;
            transition: width 0.8s ease;
        }

        .result.human .progress-bar { background: linear-gradient(90deg, #10b981, #34d399); }
        .result.ai    .progress-bar { background: linear-gradient(90deg, #ef4444, #f87171); }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            opacity: 0.6;
        }

        .result-reason {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 400;
            opacity: 0.65;
            line-height: 1.6;
            text-align: left;
            border-top: 1px solid rgba(255,255,255,0.07);
            padding-top: 10px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- Aurora background blobs -->
<div class="aurora aurora-1"></div>
<div class="aurora aurora-2"></div>
<div class="aurora aurora-3"></div>

<!-- Particle canvas -->
<canvas id="canvas"></canvas>

<div class="container">
    <div class="card">
        <div class="eq-bars">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
        </div>

        <h1>AI Audio Detector</h1>
        <p class="subtitle">Detect whether audio is AI generated or human</p>

        <form id="uploadForm">
            <div class="upload-area">
                <input type="file" name="file" accept=".mp3,.wav,.mp4,.ogg,.flac,.aac,.m4a,.wma,.aiff,.aif" required id="fileInput">
                <div class="upload-icon">🎵</div>
                <div class="upload-text"><span>Click to upload</span> or drag & drop</div>
                <div class="file-types">MP3 · WAV · MP4 · OGG · FLAC · AAC · M4A · WMA · AIFF</div>
                <div class="selected-file" id="selectedFile"></div>
            </div>
            <button type="submit" id="analyzeBtn">Analyze Audio</button>
        </form>

        <div class="result" id="result"></div>
    </div>
</div>

<script>
    // Particle network
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = Array.from({ length: 70 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        opacity: Math.random() * 0.35 + 0.1
    }));

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // connections
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < 130) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(124, 58, 237, ${0.12 * (1 - d / 130)})`;
                    ctx.lineWidth = 0.6;
                    ctx.stroke();
                }
            }
        }

        // dots
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(148, 163, 255, ${p.opacity})`;
            ctx.fill();
        });

        requestAnimationFrame(draw);
    }

    draw();

    // File input
    document.getElementById('fileInput').addEventListener('change', function () {
        const label = document.getElementById('selectedFile');
        if (this.files[0]) {
            label.textContent = '✓ ' + this.files[0].name;
            label.style.display = 'block';
        }
    });

    // Form submit
    document.getElementById('uploadForm').onsubmit = async function (e) {
        e.preventDefault();
        const btn = document.getElementById('analyzeBtn');
        const result = document.getElementById('result');

        btn.disabled = true;
        btn.textContent = 'Analyzing...';
        result.style.display = 'none';
        result.className = 'result';

        try {
            const res = await fetch('/predict', { method: 'POST', body: new FormData(this) });
            const data = await res.json();

            if (data.error) {
                result.textContent = '⚠️ ' + data.error;
                result.classList.add('error');
            } else if (data.prediction === 'Human Audio') {
                const pct = parseFloat(data.confidence);
                const humanPct = (100 - pct).toFixed(1);
                result.classList.add('human');

                let reason = '';
                if (humanPct >= 90) reason = 'Very natural speech patterns, consistent rhythm, and organic vocal variations detected.';
                else if (humanPct >= 75) reason = 'Strong human vocal characteristics found — natural breathing, tone variation, and irregular cadence.';
                else if (humanPct >= 60) reason = 'Mostly human traits detected, though some segments showed minor synthetic patterns.';
                else reason = 'Leans human, but confidence is moderate. Audio may be short or have background noise.';

                result.innerHTML = `
                    <div class="result-label">✅ Human Audio</div>
                    <div class="progress-wrap"><div class="progress-bar" style="width:0%" id="pbar"></div></div>
                    <div class="progress-label"><span>Human confidence</span><span>${humanPct}%</span></div>
                    <div class="result-reason">${reason}</div>
                `;
                setTimeout(() => document.getElementById('pbar').style.width = humanPct + '%', 50);
            } else {
                const pct = parseFloat(data.confidence);
                result.classList.add('ai');

                let reason = '';
                if (pct >= 90) reason = 'Highly uniform pitch, robotic cadence, and absence of natural breathing patterns detected.';
                else if (pct >= 75) reason = 'Strong AI markers found — unnatural smoothness, consistent tone, and lack of vocal imperfections.';
                else if (pct >= 60) reason = 'Several AI-like patterns detected, such as flat intonation and overly clean audio quality.';
                else reason = 'Leans AI-generated, but confidence is moderate. Consider uploading a longer audio clip.';

                result.innerHTML = `
                    <div class="result-label">🤖 AI Generated Audio</div>
                    <div class="progress-wrap"><div class="progress-bar" style="width:0%" id="pbar"></div></div>
                    <div class="progress-label"><span>AI confidence</span><span>${pct.toFixed(1)}%</span></div>
                    <div class="result-reason">${reason}</div>
                `;
                setTimeout(() => document.getElementById('pbar').style.width = pct + '%', 50);
            }
            result.style.display = 'block';
        } catch {
            result.textContent = '⚠️ Could not connect to server.';
            result.classList.add('error');
            result.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Analyze Audio';
        }
    };
</script>
</body>
</html>
