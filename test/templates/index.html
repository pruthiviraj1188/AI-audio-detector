<!DOCTYPE html>
<html>
<head>
    <title>AI Audio Detection</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        .box {
            padding: 40px;
            border: 1px solid #ddd;
            display: inline-block;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            background: #000000;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>AI Audio Authenticity Detector</h2>
        <form id="uploadForm">
            <input type="file" name="file" required><br><br>
            <button type="submit">Analyze</button>
        </form>

        <h3 id="result"></h3>
    </div>

<script>
document.getElementById("uploadForm").onsubmit = async function(e) {
    e.preventDefault();

    const btn = this.querySelector("button");
    const result = document.getElementById("result");

    btn.disabled = true;
    btn.textContent = "Analyzing...";
    result.innerHTML = "";

    let formData = new FormData(this);

    try {
        let response = await fetch("/predict", {
            method: "POST",
            body: formData
        });

        let data = await response.json();

        if (data.error) {
            result.innerHTML = "Error: " + data.error;
        } else {
            result.innerHTML = "Prediction: " + data.prediction;
        }
    } catch (err) {
        result.innerHTML = "Error: Could not connect to server.";
    } finally {
        btn.disabled = false;
        btn.textContent = "Analyze";
    }
};
</script>
</body>
</html>
