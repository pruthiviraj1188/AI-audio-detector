<!DOCTYPE html>
<html>
<head>
    <title data-i18n="app_title">AI Audio Detector</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #050510;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 0;
        }

        /* Aurora blobs - Enhanced */
        .aurora {
            position: fixed;
            z-index: 0;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
            animation: drift 18s ease-in-out infinite;
        }
        .aurora-1 {
            width: 700px; height: 700px;
            background: radial-gradient(circle, #7c3aed, #a78bfa, transparent);
            top: -200px; left: -150px;
            animation: drift1 25s ease-in-out infinite;
        }
        .aurora-2 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #2563eb, #60a5fa, transparent);
            bottom: -150px; right: -150px;
            animation: drift2 30s ease-in-out infinite;
        }
        .aurora-3 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #0ea5e9, #38bdf8, transparent);
            top: 30%; left: 60%;
            animation: drift3 28s ease-in-out infinite;
        }
        .aurora-4 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #8b5cf6, transparent);
            top: 50%; right: 10%;
            animation: drift4 32s ease-in-out infinite;
            opacity: 0.15;
        }

        @keyframes drift1 {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(60px, -50px) scale(1.1) rotate(90deg); }
            50% { transform: translate(40px, 30px) scale(0.95) rotate(180deg); }
            75% { transform: translate(-40px, 50px) scale(1.05) rotate(270deg); }
        }

        @keyframes drift2 {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(-50px, 40px) scale(1.08) rotate(-90deg); }
            50% { transform: translate(30px, -40px) scale(0.92) rotate(-180deg); }
            75% { transform: translate(50px, -30px) scale(1.03) rotate(-270deg); }
        }

        @keyframes drift3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-60px, 50px) scale(1.12); }
            66% { transform: translate(50px, -60px) scale(0.88); }
        }

        @keyframes drift4 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-80px, -70px) scale(1.15); }
        }

        /* Language Selector - Top Left */
        .language-selector {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
        }

        .language-selector select {
            padding: 10px 16px;
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }

        .language-selector select:hover {
            background: rgba(10, 10, 30, 0.85);
            border-color: rgba(124, 58, 237, 0.4);
        }

        .language-selector select option {
            background: #0a0a1e;
            color: #f1f5f9;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .card {
            background: rgba(10, 10, 30, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 48px 56px;
            width: 520px;
            box-shadow:
                0 0 0 1px rgba(124, 58, 237, 0.1),
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(124, 58, 237, 0.1) 50%,
                transparent 70%
            );
            animation: shimmer 8s infinite;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { transform: translate(-100%, -100%) rotate(45deg); }
            100% { transform: translate(100%, 100%) rotate(45deg); }
        }

        /* Animated equalizer bars - Enhanced */
        .eq-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            height: 30px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .eq-bar {
            width: 3px;
            border-radius: 2px;
            background: linear-gradient(to top, #7c3aed, #a78bfa, #38bdf8);
            animation: eq 1.4s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(124, 58, 237, 0.5);
        }

        .eq-bar:nth-child(1)  { height: 8px;  animation-delay: 0.0s; }
        .eq-bar:nth-child(2)  { height: 18px; animation-delay: 0.1s; }
        .eq-bar:nth-child(3)  { height: 26px; animation-delay: 0.2s; }
        .eq-bar:nth-child(4)  { height: 14px; animation-delay: 0.3s; }
        .eq-bar:nth-child(5)  { height: 30px; animation-delay: 0.15s; }
        .eq-bar:nth-child(6)  { height: 20px; animation-delay: 0.25s; }
        .eq-bar:nth-child(7)  { height: 30px; animation-delay: 0.1s; }
        .eq-bar:nth-child(8)  { height: 14px; animation-delay: 0.35s; }
        .eq-bar:nth-child(9)  { height: 26px; animation-delay: 0.2s; }
        .eq-bar:nth-child(10) { height: 18px; animation-delay: 0.1s; }
        .eq-bar:nth-child(11) { height: 8px;  animation-delay: 0.0s; }

        @keyframes eq {
            0%, 100% { transform: scaleY(0.3); opacity: 0.5; }
            50%       { transform: scaleY(1);   opacity: 1; box-shadow: 0 0 12px rgba(124, 58, 237, 0.8); }
        }

        h1 {
            color: #f1f5f9;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
        }

        .subtitle {
            color: rgba(148, 163, 184, 0.6);
            font-size: 13px;
            margin-bottom: 28px;
        }

        /* Upload Mode Content */
        #uploadModeContent {
            display: block;
        }

        .upload-area {
            border: 1.5px dashed rgba(99, 179, 237, 0.25);
            border-radius: 18px;
            padding: 28px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
        }

        .upload-area:hover {
            border-color: rgba(99, 179, 237, 0.6);
            background: rgba(56, 189, 248, 0.04);
            transform: translateY(-1px);
            box-shadow: 0 8px 32px rgba(56, 189, 248, 0.2);
        }

        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .upload-icon { font-size: 30px; margin-bottom: 8px; }

        .upload-text {
            color: rgba(203, 213, 225, 0.7);
            font-size: 14px;
        }

        .upload-text span {
            color: #38bdf8;
            font-weight: 600;
        }

        .file-types {
            color: rgba(148, 163, 184, 0.35);
            font-size: 11px;
            margin-top: 5px;
        }

        .selected-file {
            color: #38bdf8;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }

        button.action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        button.action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5);
        }

        button.action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            display: none;
            animation: fadeUp 0.4s ease;
        }

        .result.human {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .result.ai {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .result.error {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
        }

        .result-label {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .progress-wrap {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-bar {
            height: 100%;
            border-radius: 999px;
            transition: width 0.8s ease;
        }

        .result.human .progress-bar { background: linear-gradient(90deg, #10b981, #34d399); }
        .result.ai    .progress-bar { background: linear-gradient(90deg, #ef4444, #f87171); }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            opacity: 0.6;
        }

        .result-reason {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 400;
            opacity: 0.65;
            line-height: 1.6;
            text-align: left;
            border-top: 1px solid rgba(255,255,255,0.07);
            padding-top: 10px;
        }

        .tech-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.07);
            padding-top: 12px;
        }

        .tech-item {
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 10px 12px;
            text-align: left;
        }

        .tech-item .tech-label {
            font-size: 10px;
            opacity: 0.5;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .tech-item .tech-value {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.9;
        }

        .tech-item .tech-desc {
            font-size: 10px;
            opacity: 0.45;
            margin-top: 2px;
            font-weight: 400;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .card { width: 90%; padding: 32px 24px; }
            .language-selector { top: 16px; left: 16px; }
        }
    </style>
</head>
<body>

<!-- Aurora background blobs -->
<div class="aurora aurora-1"></div>
<div class="aurora aurora-2"></div>
<div class="aurora aurora-3"></div>
<div class="aurora aurora-4"></div>

<!-- Particle canvas -->
<canvas id="canvas"></canvas>

<!-- Language Selector -->
<div class="language-selector">
    <select id="languageSelect">
        <option value="en">English</option>
        <option value="hi">हिंदी (Hindi)</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="te">తెలుగు (Telugu)</option>
        <option value="ml">മലയാളം (Malayalam)</option>
    </select>
</div>

<div class="container">
    <div class="card">
        <div class="eq-bars">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
        </div>

        <h1 data-i18n="app_title">AI Audio Detector</h1>
        <p class="subtitle" data-i18n="app_subtitle">Detect AI-generated audio with 99% accuracy</p>

        <!-- Upload Mode Content -->
        <div id="uploadModeContent">
            <form id="uploadForm">
                <div class="upload-area">
                    <input type="file" name="file" accept=".mp3,.wav,.mp4,.ogg,.flac,.aac,.m4a,.wma,.aiff,.aif,.opus,.webm,.3gp" required id="fileInput">
                    <div class="upload-icon">🎵</div>
                    <div class="upload-text"><span data-i18n="upload_button">Choose File</span> <span data-i18n="upload_or">or drag and drop</span></div>
                    <div class="file-types" data-i18n="upload_formats">Supported: MP3, WAV, MP4, OGG, FLAC, AAC, M4A</div>
                    <div class="selected-file" id="selectedFile"></div>
                </div>
                <button type="submit" class="action-btn" id="analyzeBtn" data-i18n="analyze_button">Analyze Audio</button>
            </form>

            <div class="result" id="result"></div>
        </div>
    </div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/upload.js"></script>

<script>
    // Particle network animation
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = Array.from({ length: 100 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 0.5,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        opacity: Math.random() * 0.5 + 0.2,
        pulseSpeed: Math.random() * 0.02 + 0.01,
        pulsePhase: Math.random() * Math.PI * 2
    }));

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const time = Date.now() * 0.001;

        // Draw connections with gradient
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < 150) {
                    const gradient = ctx.createLinearGradient(
                        particles[i].x, particles[i].y,
                        particles[j].x, particles[j].y
                    );
                    const alpha = 0.15 * (1 - d / 150);
                    gradient.addColorStop(0, `rgba(124, 58, 237, ${alpha})`);
                    gradient.addColorStop(0.5, `rgba(56, 189, 248, ${alpha * 1.2})`);
                    gradient.addColorStop(1, `rgba(37, 99, 235, ${alpha})`);
                    
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
            }
        }

        // Draw particles with pulsing effect
        particles.forEach(p => {
            // Update position
            p.x += p.vx;
            p.y += p.vy;
            
            // Wrap around edges
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;

            // Pulsing effect
            p.pulsePhase += p.pulseSpeed;
            const pulse = Math.sin(p.pulsePhase) * 0.3 + 0.7;
            const currentR = p.r * pulse;
            const currentOpacity = p.opacity * pulse;

            // Draw particle with glow
            const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, currentR * 3);
            gradient.addColorStop(0, `rgba(168, 139, 250, ${currentOpacity})`);
            gradient.addColorStop(0.5, `rgba(139, 92, 246, ${currentOpacity * 0.5})`);
            gradient.addColorStop(1, `rgba(124, 58, 237, 0)`);

            ctx.beginPath();
            ctx.arc(p.x, p.y, currentR * 3, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Draw core
            ctx.beginPath();
            ctx.arc(p.x, p.y, currentR, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(196, 181, 253, ${currentOpacity})`;
            ctx.fill();
        });

        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
