<!DOCTYPE html>
<html>
<head>
    <title>AI Audio Detection</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        .box {
            padding: 40px;
            border: 1px solid #ddd;
            display: inline-block;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            background: #000000;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>AI Audio Authenticity Detector</h2>
        <form id="uploadForm">
            <input type="file" name="file" required><br><br>
            <button type="submit">Analyze</button>
        </form>

        <h3 id="result"></h3>
    </div>

<script>
document.getElementById("uploadForm").onsubmit = async function(e) {
    e.preventDefault();

    let formData = new FormData(this);

    let response = await fetch("/predict", {
        method: "POST",
        body: formData
    });

    let data = await response.json();

    document.getElementById("result").innerHTML =
        "Prediction: " + data.prediction;
};
</script>
</body>
</html>
